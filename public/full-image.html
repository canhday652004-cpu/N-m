<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banner không bị cắt trên điện thoại</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #e8efe6;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  /* Lớp nền: chính ảnh đó, làm mờ để lấp hai bên - trông đỡ trống */
  .bg {
    position: absolute;
    inset: -6%;
    width: 112%;
    height: 112%;
    object-fit: cover;
    filter: blur(28px) saturate(1.1);
    opacity: .75;
  }

  /* Ảnh chính: LUÔN hiện trọn vẹn, không bao giờ bị cắt */
  .main {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;      /* <- điểm mấu chốt: contain, không phải cover */
    object-position: center;
    cursor: zoom-in;
  }

  .fs-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    padding: 7px 12px;
    font: 500 13px/1 system-ui, "Segoe UI", Arial, sans-serif;
    color: #fff;
    background: rgba(0, 0, 0, .45);
    border: 1px solid rgba(255, 255, 255, .5);
    border-radius: 6px;
    cursor: pointer;
  }
  .fs-btn:hover { background: rgba(0, 0, 0, .7); }

  /* Màn hình hẹp (điện thoại): ẩn nút cho gọn */
  @media (max-width: 600px) {
    .fs-btn { display: none; }
  }

  :fullscreen .stage { background: #000; }
</style>
</head>
<body>
  <div class="stage">
    <!-- ↓↓↓ DÁN LINK ẢNH VÀO CẢ HAI CHỖ src BÊN DƯỚI ↓↓↓ -->
    <img class="bg"   src="DAN_LINK_ANH_VAO_DAY" alt="" aria-hidden="true">
    <img class="main" id="banner" src="DAN_LINK_ANH_VAO_DAY" alt="">
    <!-- ↑↑↑ DÁN LINK ẢNH VÀO CẢ HAI CHỖ src BÊN TRÊN ↑↑↑ -->

    <button id="fsBtn" class="fs-btn" type="button">⛶ Toàn màn hình</button>
  </div>

  <script>
    var img = document.getElementById('banner');
    var root = document.documentElement;

    function goFullscreen() {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        return;
      }
      var req = root.requestFullscreen || root.webkitRequestFullscreen;
      if (req) {
        Promise.resolve(req.call(root)).catch(function () { window.open(img.src, '_blank'); });
      } else {
        window.open(img.src, '_blank');
      }
    }

    document.getElementById('fsBtn').addEventListener('click', goFullscreen);
    img.addEventListener('click', goFullscreen);
  </script>
</body>
</html>
