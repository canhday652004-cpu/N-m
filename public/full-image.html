<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banner Google Sites - full ảnh trên mọi thiết bị</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Nền mờ lấp phần trống, lấy từ chính ảnh chính (JS gán) */
  .bg {
    position: absolute;
    inset: -8%;
    background-size: cover;
    background-position: center;
    filter: blur(30px) saturate(1.1);
    opacity: .7;
  }

  /* Ảnh chính: luôn hiện TRỌN VẸN ở mọi kích thước màn hình */
  .main {
    position: relative;
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    cursor: zoom-in;
  }

  .err {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    font: 500 15px/1.6 system-ui, "Segoe UI", Arial, sans-serif;
    color: #b3261e;
    background: #fff4f4;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="bg" id="bg"></div>

    <!-- ===== CHỈ THAY LINK ẢNH Ở ĐÚNG MỘT CHỖ NÀY ===== -->
    <img class="main" id="banner" src="DAN_LINK_ANH_VAO_DAY" alt="">
    <!-- ================================================= -->

    <div class="err" id="err">
      Không tải được ảnh.<br>
      Hãy mở link ảnh trong một tab trình duyệt để kiểm tra trước khi dán vào src.
    </div>
  </div>

  <script>
    var img = document.getElementById('banner');

    // Lớp nền mờ dùng chung link với ảnh chính - không phải dán link hai lần
    document.getElementById('bg').style.backgroundImage = 'url("' + img.src + '")';

    img.addEventListener('error', function () {
      img.style.display = 'none';
      document.getElementById('bg').style.display = 'none';
      document.getElementById('err').style.display = 'flex';
    });

    // Bấm vào ảnh để mở ảnh gốc ở tab mới (xem full trên điện thoại)
    img.addEventListener('click', function () {
      window.open(img.src, '_blank');
    });
  </script>
</body>
</html>
